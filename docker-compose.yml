version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: jev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: creditengine
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d creditengine"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: jev-dynamodb-local
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data", "-port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodata:/home/dynamodblocal/data

volumes:
  pgdata:
  dynamodata:
